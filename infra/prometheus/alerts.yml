groups:
  - name: fuel-platform
    rules:
      - alert: ApiHighErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[1m])) / clamp_min(sum(rate(http_requests_total[1m])), 1) > 0.05
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "API 5xx rate > 5%" }
      - alert: ApiHighLatencyP95
        expr: histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[1m])) by (le)) > 0.5
        for: 1m
        labels: { severity: warning }
        annotations: { summary: "API p95 latency > 500ms" }
      - alert: SimulatorCircuitOpen
        expr: simulator_circuit_state == 2
        for: 30s
        labels: { severity: critical }
        annotations: { summary: "Simulator circuit breaker is OPEN — platform running in degraded mode" }
      - alert: FallbackPolicyActive
        expr: increase(decision_fallback_total[5m]) > 0
        labels: { severity: info }
        annotations: { summary: "Decision engine used fallback policy" }
