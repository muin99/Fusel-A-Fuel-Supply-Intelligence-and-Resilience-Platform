# Source: fuel-ops/templates/scaling.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: fuel-ops-web }
spec:
  scaleTargetRef:
    apiVersion: argoproj.io/v1alpha1
    kind: Rollout
    name: fuel-ops-web
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
# Source: fuel-ops/templates/stack.yaml
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: fuel-ops-web
  labels: { app: fuel-ops-web, version: "1.0.0" }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: fuel-ops-web }
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: {}
  template:
    metadata:
      labels: { app: fuel-ops-web }
    spec:
      containers:
        - name: web
          image: "fuel-ops-web:1.0.0"
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          env:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 60
            periodSeconds: 15
