# Source: fuel-ops/templates/stack.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuel-ops-api
  labels: { app: fuel-ops-api, version: "1.0.0" }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: fuel-ops-api }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: fuel-ops-api }
    spec:
      containers:
        - name: api
          image: "fuel-ops-api:1.0.0"
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4000 }]
          env:
            - name: AUTO_DISPATCH
              value: "false"
            - name: NODE_ENV
              value: "production"
            - name: REDIS_URL
              value: "redis://fuel-ops-redis:6379"
            - name: SIMULATOR_URL
              value: "http://fuel-ops-simulator:8000"
          envFrom:
            - secretRef: { name: fuel-ops-env }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /api/health/live, port: 4000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health/live, port: 4000 }
            initialDelaySeconds: 60
            periodSeconds: 15
---
# Source: fuel-ops/templates/stack.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuel-ops-postgres
  labels: { app: fuel-ops-postgres, version: "1.0.0" }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: fuel-ops-postgres }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: fuel-ops-postgres }
    spec:
      containers:
        - name: postgres
          image: "postgres:17-alpine"
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 5432 }]
          env:
            - name: PGDATA
              value: "/var/lib/postgresql/data/pgdata"
            - name: POSTGRES_DB
              value: "fuelops"
            - name: POSTGRES_USER
              value: "fuelops"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: fuel-ops-env, key: POSTGRES_PASSWORD }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            tcpSocket: { port: 5432 }
            initialDelaySeconds: 5
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: fuel-ops-postgres }
