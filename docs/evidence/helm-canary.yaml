# Source: fuel-ops/templates/stack.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fuel-ops-simulator
  labels: { app: fuel-ops-simulator, version: "1.0.0" }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: fuel-ops-simulator }
  strategy:
    type: Recreate
  template:
    metadata:
      labels: { app: fuel-ops-simulator }
    spec:
      containers:
        - name: simulator
          image: "asifmahmoud414/bup-fuel-supply-simulator:1.0.0"
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8000 }]
          env:
            - name: SIMULATION_SPEED
              value: "8"
            - name: SIMULATOR_START_MODE
              value: "paused"
            - name: TICK_MINUTES
              value: "15"
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: "1", memory: 512Mi }
          readinessProbe:
            httpGet: { path: /v1/health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/health, port: 8000 }
            initialDelaySeconds: 60
            periodSeconds: 15
