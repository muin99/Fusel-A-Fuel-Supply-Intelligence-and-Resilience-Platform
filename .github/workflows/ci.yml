# Source → Build → Test → Package → Deploy (compose) → Health check → Running app
name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm -r lint
      - name: Typecheck
        run: pnpm --filter api typecheck && pnpm --filter web exec tsc --noEmit
      - name: Unit tests
        run: pnpm --filter api test
      - name: Build
        run: pnpm -r build

  package-deploy-smoke:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure (CI secrets are generated, never committed)
        run: |
          cp .env.example .env
          sed -i "s/^JWT_SECRET=.*/JWT_SECRET=$(openssl rand -hex 24)/" .env
          # all k6 virtual users share one IP — lift the per-IP limit for the load test
          echo "RATE_LIMIT_PER_MIN=1000000" >> .env
      - name: Package + deploy full stack
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Health check
        run: |
          curl -fsS http://localhost:4000/api/health/live
          curl -fsS http://localhost:4000/api/health | tee health.json
          curl -fsS -o /dev/null http://localhost:3000/
      - name: Smoke — drive the simulator and expect recommendations
        run: |
          TOKEN=$(curl -fsS -X POST localhost:4000/api/auth/login -H 'content-type: application/json' \
            -d '{"username":"ci","role":"operator","password":"operator"}' | jq -r .token)
          curl -fsS -X POST localhost:4000/api/chaos/events -H "authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"type":"demand_spike","start_tick":2,"duration_ticks":40,"parameters":{"multiplier":2.5}}'
          for i in $(seq 1 40); do curl -fsS -X POST localhost:8000/admin/step > /dev/null; done
          sleep 8
          curl -fsS localhost:4000/api/forecast/risk | jq '.[0]'
          test "$(curl -fsS 'localhost:4000/api/recommendations' | jq length)" -gt 0
      - name: Load test (short)
        run: |
          docker run --rm --network host -e API_URL=http://localhost:4000/api -e VUS=20 \
            -v "$PWD/loadtest:/scripts:ro" -v "$PWD/loadtest/results:/results" grafana/k6:1.3.0 run /scripts/k6-api.js
      - uses: pnpm/action-setup@v4
        with: { version: 9.15.9 }
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - name: Browser workflow
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter web exec playwright install --with-deps chromium
          pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence
          path: |
            health.json
            loadtest/results/*.json
            docs/evidence/browser-tests.json
            docs/evidence/*.png
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
